[project]
name = "chemworkbench"
version = "2.1.0"
description = "ChemWorkBench v2.1 — modular, plugin-ready scientific SaaS platform"
authors = [
    { name = "Hayden", email = "placeholder@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chemworkbench"]

[tool.setuptools.package-data]
chemworkbench = ["**/*.json", "**/*.yaml", "**/*.yml"]
