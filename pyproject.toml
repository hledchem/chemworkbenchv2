# =====================================================================
# ChemWorkBench v2.1 — pyproject.toml
# =====================================================================
# This file defines the build system, dependencies, and metadata for
# ChemWorkBench v2.1. It is written in a Poetry‑native, PEP 621‑compliant
# format. The structure is intentionally LLM‑friendly:
#
# - Clear section boundaries
# - High‑signal commentary explaining architectural intent
# - Explicit grouping of runtime vs. development dependencies
# - Plugin‑ready packaging configuration
#
# Future AI agents should treat this file as the canonical source of
# truth for dependency resolution, packaging, and environment creation.
# =====================================================================


# =====================================================================
# [tool.poetry]
# ---------------------------------------------------------------------
# Poetry’s primary configuration block.
# This replaces the older setuptools‑based configuration and ensures:
# - deterministic builds
# - reproducible environments
# - clean dependency resolution
# - plugin‑friendly packaging
# =====================================================================
[tool.poetry]
name = "chemworkbench"
version = "2.1.0"
description = "ChemWorkBench v2.1 — modular, plugin-ready scientific SaaS platform"
authors = ["Hayden <placeholder@example.com>"]
readme = "README.md"
license = "MIT"

# Poetry needs to know which Python packages to include.
# We explicitly include the chemworkbench/ directory.
packages = [
    { include = "chemworkbench" }
]


# =====================================================================
# [tool.poetry.dependencies]
# ---------------------------------------------------------------------
# Runtime dependencies required for ChemWorkBench to function.
# These are intentionally minimal and scientific‑stack focused.
#
# LLM NOTE:
# - Do NOT add dev tools here (pytest, black, ruff, etc.)
# - Do NOT add optional plugins here
# - Keep this list clean and stable
# =====================================================================
[tool.poetry.dependencies]
python = ">=3.10"
numpy = ">=1.26"
pydantic = ">=2.0"
matplotlib = ">=3.8"
scipy = ">=1.11"


# =====================================================================
# [tool.poetry.group.dev.dependencies]
# ---------------------------------------------------------------------
# Development‑only dependencies.
# These are NOT installed by default unless the user runs:
#
#     poetry install --with dev
#
# LLM NOTE:
# - This is the correct place for testing, linting, formatting tools.
# - Do NOT move these into the main dependency list.
# =====================================================================
[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"
black = "*"
ruff = "*"


# =====================================================================
# [tool.poetry.include]
# ---------------------------------------------------------------------
# Include non‑Python files inside the package distribution.
# This is essential for:
# - anchor libraries
# - plugin metadata
# - YAML/JSON configs
# - templates
#
# LLM NOTE:
# - If you add new config formats, extend this list.
# - Keep patterns broad but safe.
# =====================================================================
[tool.poetry.include]
files = [
    "chemworkbench/**/*.json",
    "chemworkbench/**/*.yaml",
    "chemworkbench/**/*.yml"
]


# =====================================================================
# [build-system]
# ---------------------------------------------------------------------
# Poetry uses poetry-core as its backend.
# This is the modern, lightweight, PEP 517‑compliant build system.
#
# LLM NOTE:
# - Do NOT switch back to setuptools unless absolutely necessary.
# - poetry-core ensures reproducible builds and clean packaging.
# =====================================================================
[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
