# =====================================================================
# ChemWorkBench v2.1 — pyproject.toml
# =====================================================================
# This file defines the build system, dependencies, and metadata for
# ChemWorkBench v2.1. It is written in a Poetry‑native, PEP 621‑aligned
# format with extensive commentary for future maintainers and AI agents.
#
# Architectural goals:
# - Deterministic builds
# - Plugin‑ready packaging
# - Clean separation of runtime vs. dev dependencies
# - LLM‑safe structure with explicit intent
# =====================================================================


# =====================================================================
# [tool.poetry]
# ---------------------------------------------------------------------
# Core project metadata used by Poetry for packaging and environment
# management. This replaces setuptools entirely.
# =====================================================================
[tool.poetry]
name = "chemworkbench"
version = "2.1.0"
description = "ChemWorkBench v2.1 — modular, plugin-ready scientific SaaS platform"
authors = ["Hayden <placeholder@example.com>"]
readme = "README.md"
license = "MIT"

# Poetry needs to know which Python packages to include.
packages = [
    { include = "chemworkbench" }
]

# Poetry expects "include" to be a flat array, not a table.
# These patterns ensure that JSON/YAML config files, anchor libraries,
# and plugin metadata are included in the final wheel.
include = [
    "chemworkbench/**/*.json",
    "chemworkbench/**/*.yaml",
    "chemworkbench/**/*.yml"
]


# =====================================================================
# [tool.poetry.dependencies]
# ---------------------------------------------------------------------
# Runtime dependencies required for ChemWorkBench to function.
# Keep this list minimal and stable.
# =====================================================================
[tool.poetry.dependencies]
python = ">=3.10"
numpy = ">=1.26"
pydantic = ">=2.0"
matplotlib = ">=3.8"
scipy = ">=1.11"


# =====================================================================
# [tool.poetry.group.dev.dependencies]
# ---------------------------------------------------------------------
# Development‑only dependencies.
# These are installed via:
#     poetry install --with dev
#
# LLM NOTE:
# - Do NOT move these into main dependencies.
# - This group is intentionally isolated.
# =====================================================================
[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = "*"
black = "*"
ruff = "*"


# =====================================================================
# [build-system]
# ---------------------------------------------------------------------
# Poetry uses poetry-core as its backend. This is the modern,
# lightweight, PEP 517‑compliant build system.
# =====================================================================
[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
